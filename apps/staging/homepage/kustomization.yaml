apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/homepage/
  - ./route.yaml
configMapGenerator:
  - name: homepage
    namespace: homepage
    options:
      labels:
        app.kubernetes.io/name: homepage
    files:
      - ./config/kubernetes.yaml
      - ./config/settings.yaml
      - ./config/custom.css
      - ./config/custom.js
      - ./config/bookmarks.yaml
      - ./config/services.yaml
      - ./config/widgets.yaml
      - ./config/docker.yaml

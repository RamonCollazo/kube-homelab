---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: notebooklm-mcp
  namespace: notebooklm
spec:
  endpointSelector:
    matchLabels:
      app: notebooklm-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agentgateway-system
            app.kubernetes.io/name: agentgateway-proxy
      toPorts:
        - ports:
            - port: "9420"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: google.com
        - matchPattern: "*.google.com"
        - matchPattern: "*.googleapis.com"
        - matchPattern: "*.googleusercontent.com"
        - matchPattern: "*.gstatic.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

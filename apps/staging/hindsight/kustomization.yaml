apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hindsight
resources:
  - ../../base/hindsight/
  - ./database.yaml
  - ./backup.yaml
  - ./route.yaml
  - ./secrets.yaml

configurations:
  - kustomizeconfig.yaml

configMapGenerator:
  - name: hindsight-values
    files:
      - values.yaml=values.yaml

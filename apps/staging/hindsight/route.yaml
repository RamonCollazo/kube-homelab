---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight
  namespace: hindsight
spec:
  parentRefs:
    - name: lan-gateway
      namespace: lan-gateway
      sectionName: lan-https
  hostnames:
    - "hindsight.raymondcollazo.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      timeouts:
        request: 10m
      backendRefs:
        - name: hindsight-api
          port: 8888
    # Per-bank MCP endpoint (/mcp/<bank>/) for clients that share a personal bank
    # across harnesses (Claude Code + Hermes on `ramon`); coding agents use /v1.
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      timeouts:
        request: 10m
      backendRefs:
        - name: hindsight-api
          port: 8888
    - backendRefs:
        - name: hindsight-control-plane
          port: 3000

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-movies-pv
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  mountOptions:
    - soft
    - timeo=600
    - retrans=2
  nfs:
    server: 10.0.150.100
    path: /mnt/DataVault/Media/Movies
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: jellyfin-media-movies-pvc
    namespace: jellyfin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media-movies-pvc
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 2Ti
  volumeName: jellyfin-media-movies-pv
  storageClassName: ""

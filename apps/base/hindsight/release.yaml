---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
  namespace: hindsight
spec:
  interval: 15m
  releaseName: hindsight
  chartRef:
    kind: OCIRepository
    name: hindsight
  valuesFrom:
    - kind: ConfigMap
      name: hindsight-values
      valuesKey: values.yaml

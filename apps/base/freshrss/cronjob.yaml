---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: freshrss-refresh
  namespace: freshrss
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: freshrss-refresh
  namespace: freshrss
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: freshrss-refresh
  namespace: freshrss
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: freshrss-refresh
subjects:
  - kind: ServiceAccount
    name: freshrss-refresh
    namespace: freshrss
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freshrss-refresh
  namespace: freshrss
spec:
  schedule: "0 6 * * *"
  timeZone: America/Puerto_Rico
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: freshrss-refresh
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.4
              args:
                - exec
                - deploy/freshrss
                - -c
                - freshrss
                - --
                - su
                - www-data
                - -s
                - /bin/sh
                - -c
                - php /var/www/FreshRSS/app/actualize_script.php
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi

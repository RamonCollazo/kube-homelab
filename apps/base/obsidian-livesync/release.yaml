---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livesync
  namespace: obsidian-livesync
spec:
  interval: 15m
  chart:
    spec:
      chart: couchdb
      version: 4.6.3
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: obsidian-livesync
  valuesFrom:
    - kind: ConfigMap
      name: couchdb-values
      valuesKey: values.yaml

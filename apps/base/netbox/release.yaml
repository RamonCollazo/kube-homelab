---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 15m
  chart:
    spec:
      chart: netbox
      version: 8.3.62
      sourceRef:
        kind: HelmRepository
        name: netbox-community
        namespace: netbox
  install:
    timeout: 15m
  upgrade:
    timeout: 15m
  valuesFrom:
    - kind: ConfigMap
      name: netbox-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: CronJob
              name: netbox-housekeeping
            patch: |
              apiVersion: batch/v1
              kind: CronJob
              metadata:
                name: netbox-housekeeping
              spec:
                jobTemplate:
                  spec:
                    ttlSecondsAfterFinished: 172800

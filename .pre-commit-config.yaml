---
repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0  # Use the latest version or a specific version
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: sops-encrypted
        name: refuse to commit unencrypted sops files
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: (^|/)secrets\.env$

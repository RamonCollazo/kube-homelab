apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: infisical
  namespace: infisical
spec:
  releaseName: infisical
  interval: 15m
  chart:
    spec:
      chart: infisical-standalone
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: infisical
        namespace: infisical
      interval: 12h
  valuesFrom:
    - kind: ConfigMap
      name: infisical-values
      valuesKey: values.yaml

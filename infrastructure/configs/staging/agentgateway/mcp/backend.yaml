---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: homelab-mcp
  namespace: agentgateway-system
spec:
  mcp:
    failureMode: FailOpen
    prefixMode: Always
    targets:
      - name: notebooklm
        static:
          host: notebooklm-mcp.notebooklm.svc.cluster.local
          port: 9420
          path: /mcp
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: notebooklm-mcp-token
      - name: hindsight
        static:
          host: hindsight-api.hindsight.svc.cluster.local
          port: 8888
          path: /mcp/claude-code/
          protocol: StreamableHTTP
          policies:
            auth:
              secretRef:
                name: hindsight-mcp-token

---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: homelab-mcp-tool-access
  namespace: agentgateway-system
spec:
  targetRefs:
    - group: agentgateway.dev
      kind: AgentgatewayBackend
      name: homelab-mcp
  backend:
    mcp:
      authorization:
        action: Require
        policy:
          matchExpressions:
            - 'mcp.tool.target != "notebooklm" || !(mcp.tool.name in ["share_set_access", "share_set_user", "share_remove_user", "notebook_delete", "source_delete", "studio_delete"])'
            - 'mcp.tool.target != "hindsight" || mcp.tool.name in ["retain", "recall", "reflect"]'

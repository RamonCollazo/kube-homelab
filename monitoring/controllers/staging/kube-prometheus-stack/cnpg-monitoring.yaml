---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-wal-archiving
  namespace: monitoring
spec:
  groups:
    - name: cnpg-wal-archiving
      rules:
        - alert: CNPGWALArchivingFailing
          expr: cnpg_pg_stat_archiver_last_failed_time > cnpg_pg_stat_archiver_last_archived_time
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "WAL archiving failing for {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "The last WAL archive attempt failed and none has succeeded since. Check rustfs and the barman-cloud plugin; WAL is piling up on the primary and point-in-time recovery is not current."
        - alert: CNPGWALArchivingStale
          expr: cnpg_collector_pg_wal_archive_status{value="ready"} > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "WAL archiving stuck for {{ $labels.namespace }}/{{ $labels.pod }}"
            description: "{{ $value }} WAL segment(s) have been waiting to be archived for over 1h. Archiving may have stopped silently; check the barman-cloud plugin sidecar and rustfs."

services:
  traefik:
    image: traefik:v3.7.9
    container_name: traefik
    restart: always
    ports:
      - 80:80
      - 443:443
      - 8090:8090
      - 8100:8100
      - 127.0.0.1:8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./certs:/letsencrypt
    networks:
      - edge

networks:
  edge:
    external: true
